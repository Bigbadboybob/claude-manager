# These services own persistent agent PTYs or their control API. A package
# update may replace libraries on disk, but must not kill running sessions.
# Rotate brain code through daemon.restart; schedule holder/OS maintenance.
$nrconf{override_rc}{qr(^cm-daemon\.service$)} = 0;
$nrconf{override_rc}{qr(^claude-manager\.service$)} = 0;
