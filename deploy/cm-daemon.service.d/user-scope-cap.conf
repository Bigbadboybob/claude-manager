# cm-daemon systemd drop-in — enable per-session memory caps on a headless host.
#
# WHY: cm-daemon.service is a *system* unit running as `User=lucas`. A system
# service started as another user gets no user-session environment, so
# `systemd-run --user --scope` (how a memory cap is applied) can't reach the
# user manager bus and fails at spawn — the child never lands in a
# `cm-sess-*.scope` cgroup and start_session SIGKILLs it. Without this drop-in
# the daemon's capability probe (mcp_config::user_scope_capable) detects that
# and runs every fire UNCAPPED (safe, but no memory cap). See DESIGN_MEMORY_CAP.md
# → "Daemon-side (headless) capping — the system-service trap".
#
# PREREQUISITE: the user manager must be running persistently, else /run/user/<UID>
# and its private socket only exist while the user has a live login session:
#     sudo loginctl enable-linger lucas
#
# INSTALL:
#     sudo mkdir -p /etc/systemd/system/cm-daemon.service.d
#     sudo cp deploy/cm-daemon.service.d/user-scope-cap.conf \
#         /etc/systemd/system/cm-daemon.service.d/
#     sudo systemctl daemon-reload && sudo systemctl restart cm-daemon
#
# The UID must be HARDCODED: in a *system* unit, `%U` expands to the UID of the
# service MANAGER (0), not of User= — systemd.unit(5) is explicit that specifier
# resolution "is not influenced by the User= setting". Deployed with %U on
# 2026-08-19 this produced XDG_RUNTIME_DIR=/run/user/0 and the cap silently
# degraded to uncapped again. Adjust 1001 to the unit's User= uid on other hosts.

[Service]
Environment=XDG_RUNTIME_DIR=/run/user/1001
# Only needed if a future code path talks to the session bus directly;
# `systemd-run --user` itself uses $XDG_RUNTIME_DIR/systemd/private.
# Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%U/bus
