[package]
name = "claude-manager-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace sibling. Transitional Phase-1 dep that lets the TUI call into
# modules already relocated into the daemon (worktree, eventually
# mcp_config / workflow / etc.) without breaking the build during the
# multi-slice refactor. Slice 10 of doc/persistent-host-daemon.md
# replaces these direct calls with RPC to a running daemon and the dep
# can be dropped at that point.
cm-daemon = { path = "../daemon" }

# Terminal UI framework
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"

# Terminal emulation
alacritty_terminal = "0.25"
# Match alacritty_terminal 0.25's polling dep exactly. Slice 10c-e-1's
# AttachedPty implements alacritty's `EventedReadWrite` trait, which
# registers fds with a `polling::Poller`. The Poller instances must
# come from the same crate version alacritty's `EventLoop` uses, or
# the trait impl can't share the poller. 3.8 is what alacritty 0.25
# pins (`alacritty_terminal/Cargo.toml::dependencies.polling`).
polling = "3.8"

# Key event -> ANSI byte encoding
terminput = "0.5"
terminput-crossterm = "0.4"

# HTTP client (blocking, used in background thread)
ureq = { version = "3", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
anyhow = "1"
base64 = "0.22.1"

# Desktop notifications (used for per-session idle notifications)
notify-rust = "4"

# SHA-256 for the argv fingerprint in the per-session memory-cap kill log.
sha2 = "0.10"

# UUID v4 for cloned-Codex transcript ids (agent_memory clone flow).
uuid = { version = "1", features = ["v4"] }

# Slice 12h: TLS-TCP transport (client side). Pin SHA-256 cert
# fingerprint via a custom `ServerCertVerifier`; the `dangerous`
# builder gives us access to that. Same `ring` provider as the
# daemon side; default features off so we don't pull in
# `aws-lc-rs` (no .crate in the offline cache) or
# `prefer-post-quantum` (irrelevant for self-signed pinning).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"

# Low-level Unix syscalls. Used by the per-session memory cap
# watcher (Linux: getuid, kill, pidfd_open / pidfd_send_signal) and
# by the daemon-launch setsid+chdir pre_exec (any Unix). libc
# compiles on every Unix target; the Linux-only call sites are
# already cfg-gated at their use sites.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# `codegen-units = 1` keeps function layout stable across small source edits.
# With the default 16, adding a few bytes to an uncalled function (e.g. the
# transcript cache) reshuffles monomorphizations between codegen units and
# can move hot functions like `App::draw_terminal` and `TerminalWidget::render`
# by ~2 KB in random directions. That was load-bearing for a lag regression we
# couldn't otherwise explain. With one codegen unit the same edit only shifts
# downstream functions by ~64 bytes (one alignment slot), which is small
# enough to not push anything across page/cache boundaries.
[profile.dev]
codegen-units = 1

[profile.release]
codegen-units = 1
