[package]
name = "claude-manager-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
# Terminal UI framework
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"

# Terminal emulation
alacritty_terminal = "0.25"

# Key event -> ANSI byte encoding
terminput = "0.5"
terminput-crossterm = "0.4"

# HTTP client (blocking, used in background thread)
ureq = { version = "3", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
anyhow = "1"
base64 = "0.22.1"

# Desktop notifications (used for per-session idle notifications)
notify-rust = "4"

# SHA-256 for the argv fingerprint in the per-session memory-cap kill log.
sha2 = "0.10"

# UUID v4 for cloned-Codex transcript ids (agent_memory clone flow).
uuid = { version = "1", features = ["v4"] }

# Low-level Linux syscalls for the per-session memory cap watcher
# (getuid, kill, pidfd_open / pidfd_send_signal via syscall numbers).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# `codegen-units = 1` keeps function layout stable across small source edits.
# With the default 16, adding a few bytes to an uncalled function (e.g. the
# transcript cache) reshuffles monomorphizations between codegen units and
# can move hot functions like `App::draw_terminal` and `TerminalWidget::render`
# by ~2 KB in random directions. That was load-bearing for a lag regression we
# couldn't otherwise explain. With one codegen unit the same edit only shifts
# downstream functions by ~64 bytes (one alignment slot), which is small
# enough to not push anything across page/cache boundaries.
[profile.dev]
codegen-units = 1

[profile.release]
codegen-units = 1
