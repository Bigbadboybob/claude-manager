[package]
name = "cm-daemon"
version = "0.1.0"
edition = "2021"

# Daemon binary that owns session PTYs, worktrees, workflow runs, and the
# MCP / TUI control socket. See doc/persistent-host-daemon.md.
#
# Phase 1: bind ~/.cm/daemon.sock with stale-socket probe and run a
# placeholder accept loop. Subsequent slices relocate modules into this
# crate (worktree, mcp_config, control, workflow) and wire the dispatch
# table.

[lib]
name = "cm_daemon"
path = "src/lib.rs"

[[bin]]
name = "cm-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Workflow TOMLs are parsed daemon-side after slice 6 of
# doc/persistent-host-daemon.md.
toml = "0.8"
# `umask(2)` is called by the socket-bind path so the inode lands at
# 0o600 atomically — without this scope the bind/chmod sequence has a
# microsecond TOCTOU window where another local process can connect
# to a too-permissive socket. Slice 4 of doc/persistent-host-daemon.md.
libc = "0.2"
# v4 UUIDs back AttachTicket identifiers — slice 5 of the design doc.
uuid = { version = "1", features = ["v4"] }
# PTY spawn primitive used by `DaemonSession::spawn` (slice 10c-a).
# Used directly rather than via `alacritty_terminal` because the
# daemon only needs the raw master/slave + child handles, not the
# Term grid or EventLoop machinery that alacritty wraps around them.
portable-pty = "0.9"
# `MasterPty::get_termios` returns `nix::sys::termios::Termios` BY TYPE
# IDENTITY, so implementing the trait honestly for the adopted-master
# type (`daemon/src/adopt.rs`, DESIGN_SEAMLESS_RESTART phase 2c) needs
# nix at exactly the version portable-pty pins (0.9 pins nix 0.28).
# Drift when portable-pty bumps its nix breaks loudly at compile time,
# never silently. Already in the tree via portable-pty with the same
# `term` feature enabled, so this adds no new compilation units — it
# only makes the existing crate nameable from daemon code.
nix = { version = "0.28", features = ["term"] }
# StreamFrame bytes are base64-encoded per the protocol-doc contract
# (see `daemon/src/control/protocol.rs::StreamFrame` and the
# decoder in `tui/src/term_shim.rs`). Slice 10c-c needs this on
# the daemon side to write attach-stream data frames the TUI can
# read. Same version as the TUI uses for symmetry.
base64 = "0.22.1"
# Per-session cgroup-OOM watcher (slice 10d-memory-cap-relocation)
# hashes argv so the JSONL kill-log records a 4-byte SHA-256
# prefix the operator can correlate against. The TUI uses the
# same dep for `tui/src/session_watch.rs`; daemon adds it here
# so the producer relocation doesn't introduce cross-crate
# dependency drift.
sha2 = "0.10"
# Sub-2b-2 (10d-mcp-surface-2b-2): blocking HTTP client used by
# `daemon/src/planning_client.rs` to POST to the planning API
# for `propose_task` (and future planning-API forwards). Same
# dep + version the TUI uses in `tui/src/api.rs::ApiClient` —
# keeping both crates on the same client avoids two HTTP
# stacks in the binary tree. `ureq` is sync; daemon's
# dispatcher is sync too, so no Tokio runtime is needed (would
# have been required for `reqwest`).
ureq = { version = "3", features = ["json"] }
# Slice 12h: TLS-TCP transport (server side). `ring` provider
# is the only one whose .crate file is in the offline cache;
# `aws-lc-rs` (rustls's other default) would pull a build-time
# C toolchain in. Disable default features so we don't transitively
# enable `aws_lc_rs` + `prefer-post-quantum`; explicit `ring`
# + `std` + `tls12` + `logging` matches what `ureq` already
# pulls in, so the dep graph stays single-version.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
# Phase 1 of doc/daemon-side-workflow-orchestration.md: the daemon must
# track each owned session's terminal mode (bracketed-paste + kitty
# keyboard) to deliver workflow activation prompts headlessly with the
# SAME Enter encoding / body framing the TUI drainer derives at fire time.
# The TUI reads the mode from an alacritty `Term` fed by the PTY stream
# (`*session.term.lock().mode()`); the daemon reproduces that exact state by
# driving the same parser over its `PtyByteFanout` bytes (see
# `workflow::pty_tracker`). Same version the TUI pins so both crates use one
# parser — parity is structural, not a re-implementation. NOTE: this is the
# first use of the `Term` grid in the daemon (the earlier comment on
# `portable-pty` above explains why PTY *spawn* deliberately avoided it);
# here we need the grid solely as a mode sink, with a `VoidListener` and no
# `EventLoop`.
alacritty_terminal = "0.25"

[dev-dependencies]
tempfile = "3"
