# Install as /etc/nginx/sites-available/cm-board-web; enable after reviewing
# existing :443 listeners. No port 80 listener or HTTP authentication bypass.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name board.latentoracle.xyz;

    ssl_certificate /etc/nginx/ssl/board-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/board-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CMBoardTLS:1m;
    ssl_session_timeout 1d;
    server_tokens off;

    # Generated from Cloudflare's published IPv4 + IPv6 ranges. This tests the
    # actual peer, not a spoofable forwarded header. Do not enable real_ip here.
    include /etc/nginx/snippets/cm-board-cloudflare.conf;
    client_max_body_size 64k;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host board.latentoracle.xyz;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 40s;
        proxy_send_timeout 15s;
        proxy_cache off;
    }
}
