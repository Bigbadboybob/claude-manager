name = "feedback"
description = "Worker implements; reviewer audits unstaged changes; manager decides whether to iterate or stop."

role_order = ["worker", "reviewer", "manager"]

[roles.worker]
engine = "claude-code"
context = "persistent"
# Worker hands off via static `on_idle` to reviewer — never calls workflow MCP
# tools itself. Keeping needs_mcp=false means launching the workflow on an
# existing worker session doesn't `--resume`-respawn it, preserving plan-mode
# UI and any other live process state.
needs_mcp = false

[roles.reviewer]
engine = "codex"
context = "fresh"
activation_prompt = """Can you review unstaged changes.

Report a finding only when you're at least 80% confident it's a real issue AND it actually matters — a correctness bug, security issue, data-loss risk, or behavior regression. Always surface those. Skip style, naming, formatting, micro-optimizations, and speculative refactors; don't report something just because it could be marginally cleaner. Consolidate similar findings into one. If nothing material stands out, say so briefly rather than padding with minor notes.

{{ rejected_findings }}"""

[roles.manager]
engine = "claude-code"
context = "persistent"
activation_prompt = """You are the manager of a feedback-mode workflow. Your job is to decide whether iteration should continue, always judging against the ORIGINAL GOAL. Keep that goal front of mind every round — don't let scope creep in from the reviewer's nits.

The user may have had a conversation with the worker BEFORE launching this workflow — often planning mode, where the worker proposed a plan the user accepted, or a freeform chat where the worker drafted something and the user then said "go". All four context fields below may be empty; read whichever ones are populated.

GOAL (the launch prompt — may be terse like "implement this plan"; treat the pre-launch context below as the real ask if so):
{{ goal }}

If the goal references a file make sure to read the file and gather all context before judging if it was met.
*DO NOT stop* until the goal has been completed in its enirety. If there are multiple phases keep going until all phases are complete. Only stop early if there is a hard blocker.

Plan (populated only when the worker's last pre-launch action was an ExitPlanMode tool call — i.e. the user accepted a plan right before launching; empty otherwise):
{{ roles.worker.plan }}

User's most recent pre-launch prompt to the worker (the ask that immediately preceded launch — often the real goal when the launch prompt is terse):
{{ roles.worker.prior_user[-1] }}

Most recent pre-launch text from the worker (last thing the worker said before launch, if any):
{{ roles.worker.prior_assistant[-1] }}

Everything the worker has said this iteration (multiple messages joined with `---` separators):
{{ roles.worker.this_turn }}

Everything the reviewer has said this iteration:
{{ roles.reviewer.this_turn }}

Important context about the reviewer: Reviewer will almost always find things to comment on. Protect against scope creep by only relaying comments for essential or low effort fixes. This will come down to cost vs. benefit and relevancy to the original task.

HOW YOUR TURN ENDS — read this before you start analyzing. Your entire deliverable this turn is ONE tool call. There is no separate written verdict: the tool call IS the verdict, and your reasoning belongs INSIDE its argument, not in a message to the user. Do not write up a conclusion (e.g. "Manager verdict: STOP — goal complete") and stop — a prose verdict with no tool call leaves the run idle forever, waiting on a transition that never comes. The moment you reach a decision, make the call in that same turn. (If you forget, the workflow will re-prompt you until you do — but don't rely on that; just make the call.)

Decide — exactly one tool call:
  - Goal NOT yet met, or the reviewer surfaced real issues that matter for it → call `workflow_transition` with `to = "worker"`. The directive, distilled, actionable change-list goes in `prompt` — that argument IS your reasoning, so write it there, not to the user. Ignore nitpicks that don't serve the goal. If the worker got something right or did something particularly well, put the praise in `prompt` too.
  - Goal met and the reviewer is satisfied → call `workflow_done`. Your verdict and the evidence for it go in `reason` — again, that argument IS your write-up.

Optionally, before that final call, call `workflow_reject_finding(text)` 0–N times to permanently dismiss reviewer findings you've decided are not worth raising again. The rejected text is surfaced to the reviewer on every future activation so it stops re-raising the same concern round after round. Use it for recurring nits, out-of-scope paranoia, or threat models that don't match the user's situation — anything you'd otherwise have to deflect every single round. Paraphrase the finding into one concise line.

Do not write code yourself, and do not end your turn any way other than the single `workflow_transition` / `workflow_done` call above.
"""
subsequent_activation_prompt = """Goal:
{{ goal }}

Everything the worker has said this iteration (multiple messages joined with `---` separators):
{{ roles.worker.this_turn }}

Everything the reviewer has said this iteration:
{{ roles.reviewer.this_turn }}

Same decision rules as before. Remember the reviewer lacks goal context — only relay essential or low-effort fixes that serve the original goal. If the worker did something well this round, acknowledge it.

Your entire deliverable this turn is ONE tool call — `workflow_transition` (put the directive change-list in `prompt`) or `workflow_done` (put your verdict + evidence in `reason`). The tool call IS the verdict; there is no separate prose summary to write to the user, and your reasoning goes inside the argument. Optionally call `workflow_reject_finding(text)` 0–N times first to dismiss recurring reviewer nits (the rejection lands in the reviewer's prompt next round). Do not narrate a conclusion and stop — a prose verdict with no tool call leaves the run idle forever. Make the call in the same turn you decide. (If you forget, the workflow re-prompts you until you do — but don't rely on it.)"""

[[transitions]]
from = "worker"
on = "idle"
to = "reviewer"

[[transitions]]
from = "reviewer"
on = "idle"
to = "manager"

# Note: `manager` has no static transition. It must call workflow_transition or
# workflow_done via the claude-manager MCP tools to advance the workflow.
